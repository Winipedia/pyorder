[project]
name = "pyorder"
version = "0.13.9"
description = "A Python source code ordering linter."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = [
  "LICENSE",
]
authors = [
  { name = "Winipedia", email = "winipedia@gmx.de" },
]
maintainers = [
  { name = "Winipedia", email = "winipedia@gmx.de" },
]
keywords = [
  "ast",
  "callers-before-callees",
  "class-member-ordering",
  "clean-code",
  "code-ordering",
  "code-organization",
  "code-style",
  "definition-ordering",
  "function-ordering",
  "linter",
  "method-ordering",
  "python",
  "python-linter",
  "source-code-ordering",
  "static-analysis",
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "networkx>=3.7",
  "pyrig-runtime>=3.27.0",
  "typer>=0.27.3",
]

[project.urls]
Changelog = "https://github.com/Winipedia/pyorder/releases"
Documentation = "https://Winipedia.github.io/pyorder"
Homepage = "https://github.com/Winipedia/pyorder"
Issues = "https://github.com/Winipedia/pyorder/issues"
Source = "https://github.com/Winipedia/pyorder"

[project.scripts]
pyorder = "pyrig_runtime.rig.cli.main:main"

[dependency-groups]
dev = [
  "actionlint-py>=1.7.12.25",
  "bandit>=1.9.4",
  "deptry>=0.25.1",
  "detect-secrets>=1.5.0",
  "mkdocstrings[python]>=1.0.7",
  "pre-commit-hooks>=6.0.0",
  "prek>=0.5.5",
  "pyflakes>=4.0.3",
  "pyorder",
  "pyrig-badge>=0.5.5",
  "pyrig-fixtures>=2.27.0",
  "pyrig-opensource>=1.3.0",
  "pyrig-pypi>=3.22.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-randomly>=5.0.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.17.1",
  "rumdl>=0.3.0",
  "ryl>=0.26.0",
  "shellcheck-py>=0.11.0.1",
  "shfmt-py>=4.2.0",
  "tombi>=1.8.7",
  "ty>=0.0.89",
  "typos>=1.51.1",
  "vulture>=2.16",
  "zensical>=0.0.71",
  "zizmor>=1.31.1",
]

[build-system]
requires = [
  "uv-build",
]
build-backend = "uv_build"

[tool.deptry]
root = "src"

[tool.deptry.per_rule_ignores]
DEP002 = [
  "pyrig-runtime",
]

[tool.pytest]
addopts = [
  "--cov-branch",
  "--cov-fail-under=100",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml",
  "--cov=pyorder",
  "--dist=worksteal",
  "--numprocesses=auto",
  "--report-chars=a",
]
filterwarnings = [
  "error",
]
strict = true
testpaths = [
  "tests",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = [
  "CPY001",
]
select = [
  "ALL",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ryl.lint]
strict = true

[tool.ryl.lint.rules]
ALL = "enable"
key-ordering = "disable"

[tool.vulture]
paths = [
  "src",
  "vulture_whitelist.py",
]
